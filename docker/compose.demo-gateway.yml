name: stockpilot-demo-gateway
services:
  gateway:
    profiles: [local-preparation]
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    # Requires Linux host networking, or Docker Desktop host networking enabled.
    # No port publications and no database mounts. See the runbook before launch.
    network_mode: host
    entrypoint: [nginx, -g, "daemon off;"]
    volumes:
      - ./demo-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8086/healthz]
      interval: 30s
      timeout: 5s
      retries: 3
