# Exact public authorities; no generic historical API proxy, admin or diagnostics.
# Access logs disabled: OIDC callback query strings and user prompts are private.
resolver 127.0.0.11 valid=5s ipv6=off;
access_log off;
error_log /dev/null crit;
server_tokens off;
server {
  listen 8080;
  server_name localhost;
  location = /healthz { return 200 'UP'; }
  location / { return 404; }
}
server {
  listen 57914 ssl default_server;
  server_name 127.0.0.1;
  ssl_certificate /run/stockpilot/tls.crt;
  ssl_certificate_key /run/stockpilot/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  if ($http_host != "127.0.0.1:57914") { return 400; }
  root /usr/share/nginx/html;
  client_max_body_size 260k;
  client_body_timeout 5s;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Content-Type-Options nosniff always;
  add_header Cache-Control no-store always;
  location /b2b/ {
    set $bff_upstream bff:8000;
    proxy_pass http://$bff_upstream$request_uri;
    proxy_set_header Host "127.0.0.1:57914";
    proxy_set_header X-Forwarded-Host "127.0.0.1:57914";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 100s;
    proxy_send_timeout 10s;
    proxy_connect_timeout 2s;
    proxy_next_upstream off;
  }
  location = /index.html { internal; }
  location /b2b-app { try_files $uri /index.html; }
  location /assets/ { try_files $uri =404; }
  location / { return 404; }
}
server {
  listen 57915 ssl default_server;
  server_name auth.stockpilot.test;
  ssl_certificate /run/stockpilot/tls.crt;
  ssl_certificate_key /run/stockpilot/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  if ($http_host != "auth.stockpilot.test:57915") { return 400; }
  location ~ ^/(realms/stockpilot-dev/|resources/) {
    proxy_pass http://keycloak:8080;
    proxy_set_header Host "auth.stockpilot.test:57915";
    proxy_set_header X-Forwarded-Host "auth.stockpilot.test:57915";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 57915;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 2s;
    proxy_next_upstream off;
  }
  location / { return 404; }
}
