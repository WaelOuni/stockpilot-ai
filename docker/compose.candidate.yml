name: stockpilot-v133-candidate
services:
  mongo:
    image: mongo@sha256:d731d77bfd7afd66bd487bdf627b5bf7ce4c3602ec461d635977021db529ebbc
    env_file: [{path: '${CANDIDATE_ROOT}/mongo.env', format: raw}]
    entrypoint: [bash, -ec]
    command:
      - 'cp /run/candidate-key /tmp/candidate-key; chmod 400 /tmp/candidate-key; chown 999:999 /tmp/candidate-key; exec /usr/local/bin/docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --auth --keyFile /tmp/candidate-key'
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - '${CANDIDATE_ROOT}/mongo-key:/run/candidate-key:ro'
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'mongosh --quiet --eval ''db.getSiblingDB("admin").auth(process.env.MONGO_INITDB_ROOT_USERNAME,process.env.MONGO_INITDB_ROOT_PASSWORD); if(!db.runCommand({ping:1}).ok)quit(1)''']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  postgres:
    image: pgvector/pgvector@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    env_file: [{path: '${CANDIDATE_ROOT}/postgres.env', format: raw}]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U candidate -d stockpilot_candidate_v133']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  relay:
    image: 'stockpilot-candidate-api:${CANDIDATE_REVISION}'
    entrypoint: [python, /candidate/relay.py]
    environment:
      OLLAMA_UPSTREAM: '${OLLAMA_UPSTREAM}'
      PYTHONUNBUFFERED: '1'
    volumes:
      - '${CANDIDATE_SOURCE}/scripts/candidate/relay.py:/candidate/relay.py:ro'
      - '${CANDIDATE_ROOT}/control:/candidate/control:ro'
    networks:
      front: {ipv4_address: 172.30.133.4}
      egress: {}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/health",timeout=2)']
      interval: 10s
      timeout: 4s
      retries: 10
  api:
    image: 'stockpilot-candidate-api:${CANDIDATE_REVISION}'
    env_file: [{path: '${CANDIDATE_ROOT}/api.env', format: raw}]
    command: [uvicorn, 'stockpilot.main:app', --host, 0.0.0.0, --port, '8000', --no-access-log, --proxy-headers, --forwarded-allow-ips, '172.30.133.2']
    networks:
      front: {ipv4_address: 172.30.133.3}
      data: {}
    depends_on:
      mongo: {condition: service_healthy}
      postgres: {condition: service_healthy}
      relay: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  web:
    image: 'stockpilot-candidate-web:${CANDIDATE_REVISION}'
    entrypoint: [nginx, -g, 'daemon off;']
    ports: ['127.0.0.1:${CANDIDATE_PORT}:8443']
    volumes:
      - '${CANDIDATE_ROOT}/web.conf:/etc/nginx/conf.d/default.conf:ro'
      - '${CANDIDATE_ROOT}/tls/server.crt:/candidate/server.crt:ro'
      - '${CANDIDATE_ROOT}/tls/server.key:/candidate/server.key:ro'
    networks:
      front: {ipv4_address: 172.30.133.2}
      public: {}
    depends_on:
      api: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, 'wget --no-check-certificate -q -O /dev/null https://127.0.0.1:8443/healthz']
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
networks:
  front: {internal: true, ipam: {config: [{subnet: 172.30.133.0/24}]}}
  data: {internal: true, ipam: {config: [{subnet: 172.30.134.0/24}]}}
  egress: {ipam: {config: [{subnet: 172.30.135.0/24}]}}
  public: {ipam: {config: [{subnet: 172.30.136.0/24}]}}
volumes:
  mongo_data: {}
  mongo_config: {}
  postgres_data: {}
