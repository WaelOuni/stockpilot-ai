# Canonical future topology. Current operator only permits disposable validation.
name: ${BFF_TEST_PROJECT:?unique owned project required}
x-common: &common
  restart: "no" # validation; persistent policy requires a promotion decision
  logging:
    driver: json-file
    options: {max-size: "5m", max-file: "2"}
  labels: {stockpilot.audit.purpose: "${SP_DEMO_PURPOSE:-v1384-ephemeral}"}
  security_opt: [no-new-privileges:true]
services:
  keycloak-db:
    <<: *common
    image: postgres:15-alpine@sha256:dfcf0459185089e88a43197975780f5a3078acd5ece84824a14c9d6fbbab02d0
    environment:
      POSTGRES_DB: keycloak_test
      POSTGRES_USER: keycloak_test
      POSTGRES_PASSWORD: ${BFF_TEST_DB_PASSWORD:?random runtime secret required}
    volumes: [keycloak-data:/var/lib/postgresql/data]
    networks: [identity]
    mem_limit: 384m
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U keycloak_test -d keycloak_test"]
      interval: 2s
      timeout: 5s
      retries: 60
  keycloak:
    <<: *common
    image: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    command: [start, --import-realm]
    depends_on: {keycloak-db: {condition: service_healthy}}
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak_test
      KC_DB_USERNAME: keycloak_test
      KC_DB_PASSWORD: ${BFF_TEST_DB_PASSWORD}
      KC_HOSTNAME: https://auth.stockpilot.test:57915
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: ${SP_DEMO_PROXY_IP:?exact proxy peer required}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ACCESS_LOG_ENABLED: "false"
      BFF_TEST_CLIENT_SECRET: ${BFF_TEST_CLIENT_SECRET:?random runtime secret required}
      BFF_TEST_USER_PASSWORD: ${BFF_TEST_USER_PASSWORD:?random runtime secret required}
      JAVA_OPTS_APPEND: "-Xms128m -Xmx512m"
    volumes: ["${SP_DEMO_RUNTIME:?private runtime required}/realm.json:/opt/keycloak/data/import/realm.json:ro"]
    tmpfs: [/opt/keycloak/data]
    networks: [edge, identity]
    mem_limit: 768m
    cpus: 2
    healthcheck:
      test: [CMD, bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&3; grep -q '200' <&3"]
      interval: 5s
      timeout: 3s
      retries: 30
  mongo:
    <<: *common
    image: mongo:8@sha256:d731d77bfd7afd66bd487bdf627b5bf7ce4c3602ec461d635977021db529ebbc
    command: [mongod, --replSet, rs0, --bind_ip_all, --wiredTigerCacheSizeGB, "0.5"]
    # Loopback management ports are disposable tests only, not public ingress.
    ports: ["127.0.0.1:${SP_DEMO_MONGO_PORT:-57916}:27017"]
    volumes: [mongo-data:/data/db, mongo-config:/data/configdb]
    networks: [application]
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "try { rs.status() } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }; if (!db.hello().isWritablePrimary) quit(1)"]
      interval: 2s
      timeout: 5s
      retries: 60
  test-postgres:
    <<: *common
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    command: [postgres, -p, "55432"]
    ports: ["127.0.0.1:${SP_DEMO_POSTGRES_PORT:-57918}:55432"]
    environment:
      POSTGRES_DB: stockpilot_ci
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ${BFF_TEST_DB_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [application]
    mem_limit: 512m
    cpus: 2
    healthcheck:
      test: [CMD-SHELL, "pg_isready -p 55432 -U ci -d stockpilot_ci"]
      interval: 2s
      timeout: 5s
      retries: 60
  auth-mongo:
    <<: *common
    profiles: [regression]
    image: mongo:8@sha256:d731d77bfd7afd66bd487bdf627b5bf7ce4c3602ec461d635977021db529ebbc
    ports: ["127.0.0.1:57919:27017"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ci
      MONGO_INITDB_ROOT_PASSWORD: ${BFF_TEST_DB_PASSWORD}
    tmpfs: [/data/db, /data/configdb]
    networks: [application]
    mem_limit: 384m
    cpus: 1
  bff:
    <<: *common
    profiles: [runtime]
    image: ${SP_DEMO_API_IMAGE:?explicit built revision required}
    command: [python, -m, stockpilot.infrastructure.config.b2b_demo_entrypoint]
    group_add: ["${SP_DEMO_GID:?runtime group required}"]
    depends_on:
      mongo: {condition: service_healthy}
      test-postgres: {condition: service_healthy}
    volumes:
      - ${SP_DEMO_RUNTIME}/bff.json:/run/stockpilot/bff.json:ro
      - ${SP_DEMO_RUNTIME}/tls.crt:/run/stockpilot/ca.crt:ro
    networks: [application, edge, egress]
    mem_limit: 1g
    cpus: 2
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    stop_grace_period: 100s
  proxy:
    <<: *common
    profiles: [runtime]
    image: ${SP_DEMO_WEB_IMAGE:?explicit built revision required}
    group_add: ["${SP_DEMO_GID}"]
    entrypoint: [/usr/sbin/nginx]
    command: [-g, "daemon off;"]
    ports: ["127.0.0.1:57914:57914", "127.0.0.1:57915:57915"]
    volumes:
      - ${SP_DEMO_RUNTIME}/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SP_DEMO_RUNTIME}/tls.crt:/run/stockpilot/tls.crt:ro
      - ${SP_DEMO_RUNTIME}/tls.key:/run/stockpilot/tls.key:ro
    networks:
      edge:
        ipv4_address: ${SP_DEMO_PROXY_IP}
        aliases: [auth.stockpilot.test]
    mem_limit: 128m
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, "wget -q -O- http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
  operator:
    <<: *common
    profiles: [operator]
    image: ${SP_DEMO_API_IMAGE:?explicit built revision required}
    command: [python, -m, stockpilot.infrastructure.config.b2b_demo_worker, check]
    group_add: ["${SP_DEMO_GID}"]
    volumes:
      - ${SP_DEMO_RUNTIME}/operator.json:/run/stockpilot/operator.json:ro
    networks: [application, egress]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    cpus: 1
    cap_drop: [ALL]

networks:
  edge:
    ipam:
      config: [{subnet: "${SP_DEMO_SUBNET:?unused subnet required}"}]
  # Test-only loopback management needs bridge NAT on Docker Desktop.
  # No public DB binding; remove management ports at authorized promotion.
  application: {}
  identity: {internal: true}
  egress: {}
volumes:
  mongo-data: {labels: {stockpilot.audit.purpose: "${SP_DEMO_PURPOSE:-v1384-ephemeral}"}}
  mongo-config: {labels: {stockpilot.audit.purpose: "${SP_DEMO_PURPOSE:-v1384-ephemeral}"}}
  postgres-data: {labels: {stockpilot.audit.purpose: "${SP_DEMO_PURPOSE:-v1384-ephemeral}"}}
  keycloak-data: {labels: {stockpilot.audit.purpose: "${SP_DEMO_PURPOSE:-v1384-ephemeral}"}}
