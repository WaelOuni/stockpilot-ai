# Lot 1: local preparation only. Business APIs remain closed until lot 2.
# Included in nginx's http context; independent of the DEV Vite proxy.
map $request_uri $demo_noncanonical {
    default 0;
    ~^[^?]*% 1;
    ~^[^?]*// 1;
    "~^[^?]*\\\\" 1;
    ~^[^?]*/\. 1;
}
map "$request_method:$uri" $demo_allowed {
    default 0;
    ~^(GET|HEAD):/$ 1;
    ~^(GET|HEAD):/index\.html$ 1;
    ~^(GET|HEAD):/(assistant|products|orders)$ 1;
    ~^(GET|HEAD):/(products|orders)/[A-Za-z0-9_-]+$ 1;
    ~^(GET|HEAD):/assets/[A-Za-z0-9_-]+\.(js|css)$ 1;
    ~^GET:/healthz$ 1;
    ~^GET:/api/health$ 1;
}
server {
    listen 127.0.0.1:8086;
    server_name localhost;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log off;
    # Error logs can contain raw URIs; do not record request diagnostics here.
    error_log /dev/null;
    client_max_body_size 16k;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    if ($demo_noncanonical) { return 403; }
    if ($demo_allowed = 0) { return 403; }

    location = /healthz { return 200 'UP'; }
    location = /api/health {
        # Fixed DEMO target. Never forward cookies, JWTs, identity or proxy headers.
        set $args "";
        proxy_pass http://127.0.0.1:8003/health;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host 127.0.0.1:8003;
        proxy_set_header Connection close;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_hide_header Set-Cookie;
    }
    location /api/ { return 403; }
    location /assets/ { try_files $uri =404; }
    location / { try_files /index.html =404; }
}
