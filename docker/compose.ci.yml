name: stockpilot-ci
services:
  mongo-migrations-auth:
    image: mongo:8
    command: [mongod, --auth, --bind_ip_all]
    ports: ["127.0.0.1:27028:27017"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ci
      MONGO_INITDB_ROOT_PASSWORD: ci
    tmpfs: [/data/db, /data/configdb]
    healthcheck:
      test: [CMD, mongosh, --quiet, --username, ci, --password, ci, --authenticationDatabase, admin, --eval, "if (!db.hello().isWritablePrimary) quit(1)"]
      interval: 2s
      timeout: 5s
      retries: 60
  mongo:
    image: mongo:8
    command: [mongod, --replSet, rs0, --bind_ip_all]
    ports: ["127.0.0.1:27027:27017"]
    tmpfs: [/data/db, /data/configdb]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "try { rs.status() } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }; if (!db.hello().isWritablePrimary) quit(1)"]
      interval: 2s
      timeout: 5s
      retries: 60
  postgres:
    image: pgvector/pgvector:pg16
    ports: ["127.0.0.1:55432:5432"]
    environment:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: stockpilot_ci
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ci -d stockpilot_ci"]
      interval: 2s
      timeout: 5s
      retries: 30
