name: Synthetic browser validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'src/**'
      - 'evals/fixtures/catalogue_advice.py'
      - 'scripts/serve_advice_fixture.py'
      - 'requirements*.lock'
      - '.github/workflows/browser-synthetic.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: synthetic-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  advice-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      LOG_FILE: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.lock && .venv/bin/python -m pip install --no-deps -e .
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test --config playwright.advice-synthetic.config.ts
        working-directory: frontend
      - run: npx playwright test --config playwright.b2b-ux.config.ts --reporter=line,junit
        working-directory: frontend
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: /tmp/v025-browser.xml
      - name: Export direct browser corpus evidence
        if: always()
        env:
          QUALIFICATION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: .venv/bin/python -m evals.assistant_v025.evidence --junit /tmp/v025-browser.xml --sha "$QUALIFICATION_HEAD_SHA" --output /tmp/v025-browser-qualified.json
      - name: Retain sanitized browser qualification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assistant-v025-browser-proof
          path: /tmp/v025-browser-qualified.json
          if-no-files-found: error
          retention-days: 14
