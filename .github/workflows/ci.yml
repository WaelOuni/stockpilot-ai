name: StockPilot CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_call:
    inputs:
      release_sha:
        required: true
        type: string
    outputs:
      validated_sha:
        description: Exact SHA after all five mandatory jobs succeed
        value: ${{ jobs.release-validation.outputs.sha }}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-quality:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock && python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m pytest -q
  eval-framework:
    name: AI Eval Framework
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock && python -m pip install --no-deps -e .
      - run: python -m pytest -q tests/test_evals.py tests/test_eval_ci.py
      - run: python scripts/run_evals.py --mode deterministic --suite enriched
  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGO_TEST_URI: mongodb://127.0.0.1:27027/?replicaSet=rs0&directConnection=true
      POSTGRES_TEST_URI: postgresql://ci:ci@127.0.0.1:55432/stockpilot_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock && python -m pip install --no-deps -e .
      - run: docker compose -f docker/compose.ci.yml up -d --wait
      - run: python scripts/ci/check_targets.py
      - run: python -m pytest -q -m integration tests/test_mongo_transaction_integration.py tests/test_mongo_product_import_integration.py tests/test_postgres_checkpoint_integration.py tests/test_order_resolution_mongo_integration.py tests/test_order_resolution_safety_integration.py
      - if: always()
        run: docker compose -f docker/compose.ci.yml down -v
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha || github.sha }}
      - run: docker build -t stockpilot-api:ci .
      - run: docker build -f frontend/Dockerfile -t stockpilot-web:ci .
      - run: docker compose -f docker/compose.ci.yml up -d --wait
      - name: Start images on isolated services
        run: |
          docker run -d --name ci-api --network stockpilot-ci_default -p 127.0.0.1:58000:8000 -e MONGO_URI='mongodb://mongo:27017/?replicaSet=rs0&directConnection=true' -e MONGO_DATABASE=stockpilot_ci_runtime -e POSTGRES_URL=postgresql://ci:ci@postgres:5432/stockpilot_ci -e OLLAMA_BASE_URL=http://127.0.0.1:9 stockpilot-api:ci
          docker run -d --name ci-web --network stockpilot-ci_default -p 127.0.0.1:58080:8080 -e API_UPSTREAM=http://ci-api:8000 stockpilot-web:ci
      - run: python3 scripts/ci/smoke_images.py
      - if: always()
        run: |
          docker rm -f ci-web ci-api || true
          docker compose -f docker/compose.ci.yml down -v
  e2e:
    # Existing harness requires real Ollama classification; see docs/ci-cd.md.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: echo 'Disabled until a deterministic browser harness is approved.'
  release-validation:
    # Preserve existing PR check names. This aggregate is only used by manual release.
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs: [backend-quality, eval-framework, frontend-quality, integration-tests, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      sha: ${{ steps.required.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha }}
      - id: required
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
          VALIDATED_SHA: ${{ inputs.release_sha }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          from scripts.ci.release_guard import validate_jobs
          validate_jobs(json.loads(os.environ['REQUIRED_RESULTS']), os.environ['VALIDATED_SHA'], os.environ['EXPECTED_SHA'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"sha={os.environ['VALIDATED_SHA']}\n")
          PYCODE
