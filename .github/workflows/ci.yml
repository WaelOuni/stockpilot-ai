name: StockPilot CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_call:
    inputs:
      release_sha:
        required: true
        type: string
    outputs:
      validated_sha:
        description: Exact SHA after all five mandatory jobs succeed
        value: ${{ jobs.release-validation.outputs.sha }}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-quality:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock && python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m pytest -q
  eval-framework:
    name: AI Eval Framework
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock && python -m pip install --no-deps -e .
      - run: python -m pytest -q tests/test_evals.py tests/test_eval_ci.py
      - run: python scripts/run_evals.py --mode deterministic --suite enriched
  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
  integration-tests:
    # MongoDB refuses Linux >=6.19 (SERVER-121912). Keep DB jobs on the 6.8 image.
    # Revisit this pin before the Ubuntu 22.04 hosted-image retirement.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      MONGO_TEST_URI: mongodb://127.0.0.1:27027/?replicaSet=rs0&directConnection=true
      MONGO_MIGRATION_AUTH_TEST_URI: mongodb://ci:ci@127.0.0.1:27028/?authSource=admin
      POSTGRES_TEST_URI: postgresql://ci:ci@127.0.0.1:55432/stockpilot_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock && python -m pip install --no-deps -e .
      - name: Start disposable integration services
        run: |
          if ! docker compose -f docker/compose.ci.yml up -d --wait; then
            docker compose -f docker/compose.ci.yml ps -a
            docker compose -f docker/compose.ci.yml logs --no-color --tail 160 mongo mongo-migrations-auth postgres
            exit 1
          fi
      - run: python scripts/ci/check_targets.py
      - run: python -m pytest -q --junitxml=/tmp/v025-integration.xml -m "integration and not integration_optional" tests
      - name: Export direct assistant corpus evidence
        if: always()
        env:
          QUALIFICATION_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.release_sha || github.sha }}
        run: python -m evals.assistant_v025.evidence --junit /tmp/v025-integration.xml --sha "$QUALIFICATION_HEAD_SHA" --output /tmp/v025-qualified.json --markdown /tmp/v025-qualified.md
      - name: Retain sanitized assistant qualification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assistant-v025-qualification
          path: |
            /tmp/v025-qualified.json
            /tmp/v025-qualified.md
          if-no-files-found: error
          retention-days: 14
      - if: always()
        run: docker compose -f docker/compose.ci.yml down
  containers:
    # Same MongoDB kernel compatibility requirement as integration-tests.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.release_sha || github.sha }}
      - run: docker build -t stockpilot-api:ci .
      - run: docker build -f frontend/Dockerfile -t stockpilot-web:ci .
      - name: Build and verify pinned Keycloak theme
        env:
          SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SHA"
          docker build --platform linux/amd64 --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$SHA" -f docker/keycloak/Dockerfile -t stockpilot-keycloak:ci docker/keycloak
          python3 scripts/ci/check_keycloak_image.py stockpilot-keycloak:ci --revision "$SHA" --source "https://github.com/$GITHUB_REPOSITORY"
      - name: Build immutable schema6 rollback candidate (local only)
        run: python3 scripts/ops/schema6_rollback.py --build --output "$RUNNER_TEMP/schema6-build.json"
      - name: Build immutable historical Web and pinned browser (local only)
        run: python3 scripts/ci/build_schema6_browser.py --output "$RUNNER_TEMP/schema6-browser-build.json"
      - name: Start disposable image-test services
        run: |
          if ! docker compose -f docker/compose.ci.yml up -d --wait; then
            docker compose -f docker/compose.ci.yml ps -a
            docker compose -f docker/compose.ci.yml logs --no-color --tail 160 mongo mongo-migrations-auth postgres
            exit 1
          fi
      - name: Start images on isolated services
        run: |
          docker run -d --name ci-api --network stockpilot-ci_default -p 127.0.0.1:58000:8000 -e MONGO_URI='mongodb://mongo:27017/?replicaSet=rs0&directConnection=true' -e MONGO_DATABASE=stockpilot_ci_runtime -e POSTGRES_URL=postgresql://ci:ci@postgres:5432/stockpilot_ci -e OLLAMA_BASE_URL=http://127.0.0.1:9 stockpilot-api:ci
          docker run -d --name ci-web --network stockpilot-ci_default -p 127.0.0.1:58080:8080 -e API_UPSTREAM=http://ci-api:8000 stockpilot-web:ci
      - run: python3 scripts/ci/smoke_images.py
      - name: Qualify schema6 migration, rollback and isolated restore
        run: |
          docker pull postgres:15-alpine@sha256:dfcf0459185089e88a43197975780f5a3078acd5ece84824a14c9d6fbbab02d0
          python3 scripts/ci/qualify_schema6_rollback.py --build-report "$RUNNER_TEMP/schema6-build.json" --browser-build-report "$RUNNER_TEMP/schema6-browser-build.json" --current-image stockpilot-api:ci --keycloak-image stockpilot-keycloak:ci --output "$RUNNER_TEMP/schema6-qualification.json"
      - name: Retain sanitized schema6 qualification proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: schema6-rollback-proof
          path: |
            ${{ runner.temp }}/schema6-build.json
            ${{ runner.temp }}/schema6-browser-build.json
            ${{ runner.temp }}/schema6-qualification.json
          if-no-files-found: error
          retention-days: 14
      - if: always()
        run: |
          docker rm -f ci-web ci-api || true
          docker compose -f docker/compose.ci.yml down
  e2e:
    # Existing harness requires real Ollama classification; see docs/ci-cd.md.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: echo 'Disabled until a deterministic browser harness is approved.'
  release-validation:
    # Preserve existing PR check names. This aggregate is only used by manual release.
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs: [backend-quality, eval-framework, frontend-quality, integration-tests, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      sha: ${{ steps.required.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha }}
      - id: required
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
          VALIDATED_SHA: ${{ inputs.release_sha }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          from scripts.ci.release_guard import validate_jobs
          validate_jobs(json.loads(os.environ['REQUIRED_RESULTS']), os.environ['VALIDATED_SHA'], os.environ['EXPECTED_SHA'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"sha={os.environ['VALIDATED_SHA']}\n")
          PYCODE
